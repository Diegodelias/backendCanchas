# Entorno de desarrollo: API + Postgres propio de Canchas3.
# Las credenciales de la base son solo para desarrollo local.
# Las credenciales de la cámara NO van acá: se cargan desde backend/.env (que no se versiona).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canchas3
      POSTGRES_PASSWORD: canchas3
      POSTGRES_DB: canchas3
    ports:
      - "5432:5432"
    volumes:
      - canchas3-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canchas3 -d canchas3"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Buzón de pruebas: recibe los mails de acceso sin entregarlos a nadie. Interfaz web en :8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  api:
    build: .
    # Variables de la cámara (CAM_*, LIVE_*): opcionales; si no existe backend/.env, la cámara queda sin configurar.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      PORT: "3100"
      # Esta línea tiene prioridad sobre el .env: dentro de Docker la base se llama "db".
      DATABASE_URL: postgres://canchas3:canchas3@db:5432/canchas3
      # Los links de acceso se envían al Mailpit del compose y apuntan al frontend de desarrollo.
      SMTP_URL: smtp://mailpit:1025
      PUBLIC_APP_URL: http://localhost:3000
    ports:
      # Puerto del host; se puede cambiar con API_PORT si el 3100 está ocupado (p. ej. por el PoC de RTSP).
      - "${API_PORT:-3100}:3100"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  canchas3-db:
